# Guardar en: .github/workflows/snake.yml (repo Sergio-Velandia/Sergio-Velandia)
# Genera la serpiente animada de contribuciones cada día y la publica en la rama "output".
name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"   # todos los días a medianoche de Bogotá (05:00 UTC)
  workflow_dispatch:       # botón para correrlo a mano desde la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG de la serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#C9A96E

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
